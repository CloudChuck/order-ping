kind = "web"
previewPath = "/"
title = "OrderPing"
version = "1.0.0"
id = "artifacts/orderping"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21623

[services.development]
run = "pnpm --filter @workspace/orderping run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/orderping", "run", "build" ]
publicDir = "artifacts/orderping/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21623"
BASE_PATH = "/"
